<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>

  <nav>
    <div class="nav-logo">🎪</div>
    <ul class="nav-links">
      <li><a href="#hero">Início</a></li>
      <li><a href="#atracoes">Atrações</a></li>
      <li><a href="#programacao">Programação</a></li>
      <li><a href="#ingressos">Ingressos</a></li>
      <li><a href="#contato" class="nav-cta">Contato</a></li>
    </ul>
  </nav>

  <section id="hero">
    <div class="hero-content">
      <h1>Festival dos Aurudos</h1>
      <p>Descrição do festival aqui</p>
    </div>
  </section>

  <section id="atracoes">
    <h2 class="text-center mb-4">Atrações</h2>
    <div class="cards-wrapper">
  
      <div class="card">
        <img src="./image/carrinho.webp" class="card-img-top" alt="carrinho">
        <div class="card-body">
          <h5 class="card-title">Carrinho bate-bate</h5>
          <p class="card-text">Carrinhos que batem e são legais.</p>
        </div>
      </div>
  
      <div class="card">
        <img src="./image/tower.webp" class="card-img-top" alt="tower">
        <div class="card-body">
          <h5 class="card-title">Big Tower</h5>
          <p class="card-text">É bem big e não é uma cópia do Beto Carrero.</p>
        </div>
      </div>
  
      <div class="card">
        <img src="./image/montanha.webp" class="card-img-top" alt="montanha">
        <div class="card-body">
          <h5 class="card-title">Montanha-Russa</h5>
          <p class="card-text">Alta, rápida e muito radical.</p>
        </div>
      </div>
  
    </div>
  </section>
